# MongoDB local en replica set : Prisma en a besoin pour écrire (transactions).
#   docker compose up -d --wait
#   MONGODB_URI=mongodb://localhost:27017/detox?directConnection=true
# Port déjà pris : MONGO_PORT=27018 docker compose up -d --wait
services:
  mongo:
    # 8.x ne démarre pas sur un noyau Linux 6.19 ou plus (SERVER-121912).
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    # Initialise le replica set au premier passage, puis vérifie qu'il répond.
    healthcheck:
      test: >-
        mongosh --quiet --eval "try { rs.status().ok } catch (e) {
        rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 10s
      start_period: 30s
      start_interval: 1s

volumes:
  mongo-data:
