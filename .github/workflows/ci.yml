name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  db:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://localhost:27017/detox_smoke?directConnection=true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait mongo
      - run: pnpm db:indexes
      - name: pnpm db:seed (deux passes)
        run: |
          pnpm db:seed --users 20 --posts 50
          pnpm db:seed --users 20 --posts 50
          docker compose exec -T mongo mongosh --quiet detox_smoke --eval '
            const count = (name, filter = {}) => db.getCollection(name).countDocuments(filter);
            // 50 posts aléatoires et 48 de la maquette (comptes @detox.test).
            const got = {
              users: count("users", { email: /@seed\.detox\.local$/ }),
              scenarioUsers: count("users", { email: /@detox\.test$/ }),
              posts: count("posts"),
              shopItems: count("shop_items"),
              follows: count("follows"),
              likes: count("likes"),
              pointEvents: count("point_events"),
            };
            printjson(got);
            const ok = got.users === 20 && got.scenarioUsers === 6 && got.posts === 98 && got.shopItems === 4
              && got.follows > 0 && got.likes > 0 && got.pointEvents > 0;
            if (!ok) quit(1);
          '
      - run: pnpm db:smoke
      - run: pnpm test
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017/detox_test?directConnection=true
      - if: failure()
        run: docker compose logs mongo
